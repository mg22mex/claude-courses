name: Sync Training to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'training/**'
      - 'README.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone & Run Sync
        env:
          GDRIVE_SECRET: ${{ secrets.GDRIVE_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # 1. Safely store the service account JSON
          echo "$GDRIVE_SECRET" > sa.json
          
          # 2. Build standard rclone config profile
          mkdir -p ~/.config/rclone
          cat <<CONFIG > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          service_account_file = sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          CONFIG
          
          # 3. Direct mirror syncing with ownership bypass flags
          echo "⚡ Starting core training assets synchronization..."
          rclone sync training/ gdrive:training --verbose --drive-use-trash=false --drive-upload-cutoff=0

          echo "⚡ Copying master README template..."
          rclone copyto README.md gdrive:README.md --verbose --drive-use-trash=false --drive-upload-cutoff=0
          
          # 4. Cleanup temporary credentials file
          rm sa.json
