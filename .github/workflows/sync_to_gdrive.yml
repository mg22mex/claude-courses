name: Sync Training to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'training/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'portal-flight-manual.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone & Run Sync
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # Build a personal user token profile
          mkdir -p ~/.config/rclone
          cat <<CONFIG > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          token = $GDRIVE_TOKEN
          root_folder_id = $GDRIVE_FOLDER_ID
          CONFIG
          
          echo "⚡ Synchronizing the core departmental tracks folder..."
          rclone sync training/ gdrive:training --verbose --drive-use-trash=false

          echo "⚡ Copying master README template..."
          rclone copyto README.md gdrive:README.md --verbose --drive-use-trash=false

          echo "⚡ Copying master CLAUDE engineering guidelines..."
          rclone copyto CLAUDE.md gdrive:CLAUDE.md --verbose --drive-use-trash=false

          echo "⚡ Copying master Portal Flight Manual..."
          rclone copyto portal-flight-manual.md gdrive:portal-flight-manual.md --verbose --drive-use-trash=false
