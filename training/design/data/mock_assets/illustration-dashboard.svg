<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-bg-light)"/>
      <stop offset="100%" stop-color="#e8f4f8"/>
    </linearGradient>
  </defs>
  <title>Dashboard Overview</title>
  <desc></desc>
  <rect width="800" height="500" fill="url(#bgGrad)" rx="8"/>
  <g id="header">
    <rect x="30" y="20" width="740" height="60" fill="var(--color-surface)" rx="6"/>
    <text x="50" y="58" font-family="Inter, sans-serif" font-size="20" font-weight="bold" fill="var(--color-text-primary)">Dashboard</text>
    <circle cx="730" cy="50" r="18" fill="#C0FFEE"/>
    <circle cx="690" cy="50" r="18" fill="#BADA55"/>
  </g>
  <g id="chart-area">
    <rect x="30" y="100" width="480" height="280" fill="var(--color-surface)" rx="6" stroke="var(--color-border)" stroke-width="1"/>
    <polyline points="70,340 130,280 190,300 250,220 310,240 370,180 430,200 490,160" fill="none" stroke="var(--color-primary)" stroke-width="3"/>
    <polyline points="70,340 130,310 190,330 250,290 310,300 370,260 430,270 490,250" fill="none" stroke="var(--color-secondary)" stroke-width="2" stroke-dasharray="5,3"/>
    <g id="chart-labels">
      <text x="70" y="365" font-family="Arial" font-size="11" fill="#666">Mon</text>
      <text x="190" y="365" font-family="Arial" font-size="11" fill="#666">Wed</text>
      <text x="310" y="365" font-family="Arial" font-size="11" fill="#666">Fri</text>
      <text x="430" y="365" font-family="Arial" font-size="11" fill="#666">Sun</text>
    </g>
  </g>
  <g id="sidebar">
    <rect x="530" y="100" width="240" height="130" fill="var(--color-surface)" rx="6"/>
    <text x="550" y="130" font-family="Inter" font-size="14" font-weight="bold" fill="var(--color-text-primary)">Storage Used</text>
    <rect x="550" y="145" width="200" height="12" fill="#e0e0e0" rx="6"/>
    <rect x="550" y="145" width="140" fill="var(--color-primary)" height="12" rx="6"/>
    <text x="550" y="175" font-family="Inter" font-size="12" fill="var(--color-text-secondary)">Used: 140 GB of 200 GB</text>
    <rect x="530" y="250" width="240" height="130" fill="var(--color-surface)" rx="6"/>
    <text x="550" y="280" font-family="Inter" font-size="14" font-weight="bold" fill="var(--color-text-primary)">Active Users</text>
    <text x="550" y="310" font-family="Inter" font-size="32" font-weight="bold" fill="var(--color-primary)">1,247</text>
    <text x="550" y="335" font-family="Inter" font-size="12" fill="var(--color-secondary)">+12.4% vs last week</text>
  </g>
  <g id="footer">
    <rect x="30" y="400" width="740" height="80" fill="var(--color-surface)" rx="6"/>
    <path d="M 50 440 L 150 420 L 250 435 L 350 410 L 450 425 L 550 405 L 650 418 L 750 410" fill="none" stroke="var(--color-primary)" stroke-width="2"/>
    <text x="50" y="430" font-family="Arial" font-size="10" fill="#999">Activity (7 days)</text>
  </g>
</svg>
